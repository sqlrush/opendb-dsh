# opendb-dsh Collector layer. Applied after dsh-base (no dsh-web-app).
# 采集器不跑模型回合：agent-loop 与全部本地工具/沙箱禁用；只留 db seam + 指标/字典写入。
- id: session-persistence-jsonl
  disabled: true
- id: hmr
  disabled: true
- id: session-title-llm
  disabled: true
- id: agent-loop
  disabled: true
- id: tool-ask-user
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-web
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: bash-sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
- id: permission
  disabled: true
- id: attachment-local
  disabled: true
- id: spill-local
  disabled: true
- id: agent-instructions
  disabled: true
- insert:
    - id: session-persistence-pg
      name: '@opendb-dsh/session-persistence-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: tenant-context
      name: '@opendb-dsh/tenant-context'
    - id: opendb-registry
      name: '@opendb-dsh/registry'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: opendb-db
      name: '@opendb-dsh/db'
      config:
        credentialsJson: !!js process.env.OPENDB_DB_CREDENTIALS ?? ''
    - id: db-opengauss
      name: '@opendb-dsh/db-opengauss'
    - id: metrics-timescale
      name: '@opendb-dsh/metrics-timescale'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: dictionary-pg
      name: '@opendb-dsh/dictionary-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: collector
      name: '@opendb-dsh/collector'
      config:
        metricsIntervalMs: !!js Number(process.env.OPENDB_METRICS_INTERVAL_MS ?? 60000)
        dictionaryIntervalMs: !!js Number(process.env.OPENDB_DICT_INTERVAL_MS ?? 600000)
        healthPort: !!js Number(process.env.OPENDB_HEALTH_PORT ?? 9090)
