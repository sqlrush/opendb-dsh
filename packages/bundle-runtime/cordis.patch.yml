# opendb-dsh Runtime layer. Applied after dsh-base (no dsh-web-app).
# P0: the real dsh-agent-loop stays; persistence goes to PostgreSQL; zero local execution
# tools (design D5) — only ask_user is exposed to the model.
- id: session-persistence-jsonl
  disabled: true
- id: hmr
  disabled: true
- id: session-title-llm
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-web
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: bash-sandbox
  disabled: true
- id: fs-sandbox
  disabled: true
# permission presets bundle sandbox mode + approval policy and inject the shell service — no shell in Runtime
- id: permission
  disabled: true
# ── 交付冲刺（2026-09-05）备注：绑定会话后命令面板里的 compact / plan 不是本层注册的——它们由 dsh 内置智能体预设
#    （dsh/config/agent-presets/standard/agent.cordis.yml）按会话注入 agent 平面，这里加 disabled 实测无效（预设层重新 insert）。
#    入口在 ui-harness 用 CSS 收掉；自动压缩 compaction-basic 同样由预设注入，保持不动。
- insert:
    - id: session-persistence-pg
      name: '@opendb-dsh/session-persistence-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
    - id: runtime-worker
      name: '@opendb-dsh/runtime-worker'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        runtimeClass: !!js process.env.OPENDB_RUNTIME_CLASS ?? 'default'
        podName: !!js process.env.OPENDB_POD_NAME ?? process.env.HOSTNAME ?? 'runtime-local'
        pollMs: 2000
        maxConcurrent: !!js Number(process.env.OPENDB_MAX_CONCURRENT ?? 2)
        heartbeatMs: 5000
        staleMs: 30000
        healthPort: !!js Number(process.env.OPENDB_HEALTH_PORT ?? 9090)
# ── P1 W1 data plane ─────────────────────────────────────────────────────────
- id: attachment-local
  disabled: true
- id: spill-local
  disabled: true
- insert:
    - id: attachment-s3
      name: '@opendb-dsh/attachment-s3'
    - id: spill-s3
      name: '@opendb-dsh/spill-s3'
    - id: tenant-context
      name: '@opendb-dsh/tenant-context'
# ── P1 W2: 常驻指令注入（registry.instruction_doc → step1 authority message）──
- insert:
    - id: opendb-registry
      name: '@opendb-dsh/registry'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: instructions-pg
      name: '@opendb-dsh/instructions-pg'
- id: agent-instructions
  disabled: true
# ── P1 W3 批次1: db seam + og 方言 + 只读诊断工具 ────────────────────────────
- insert:
    - id: opendb-db
      name: '@opendb-dsh/db'
      config:
        credentialsJson: !!js process.env.OPENDB_DB_CREDENTIALS ?? ''
    - id: db-opengauss
      name: '@opendb-dsh/db-opengauss'
    - id: tool-db
      name: '@opendb-dsh/tool-db'
# ── P1 W3 批次2: 指标/数据字典读工具 ─────────────────────────────────────────
- insert:
    - id: metrics-timescale
      name: '@opendb-dsh/metrics-timescale'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: dictionary-pg
      name: '@opendb-dsh/dictionary-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: tool-metrics
      name: '@opendb-dsh/tool-metrics'
    # metrics_chart / chart_render：服务端差分+降采样+阈值线，会话里由 ui-chart 渲染成交互曲线
    #（user 2026-08-24：曲线/趋势/对比图是核心功能，此前模型只能用 ▇ 字符画柱子）
    - id: tool-chart
      name: '@opendb-dsh/tool-chart'
    - id: tool-health-collect
      name: '@opendb-dsh/tool-health-collect'
      config:
        # 2026-08-26：采集结果存档 opendb_health_collects，任务面板直读确定性数字
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: tool-sqlreview-collect
      name: '@opendb-dsh/tool-sqlreview-collect'
      config:
        # 2026-08-27 R5：Top SQL 采集结果存档 opendb_task_collects，任务面板直读榜单/占比/违规
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: tool-wdr-collect
      name: '@opendb-dsh/tool-wdr-collect'
      config:
        # 2026-08-29 R2：WDR 窗口全景存档 opendb_task_collects，任务面板直读全部数字
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: tool-ddl-collect
      name: '@opendb-dsh/tool-ddl-collect'
    - id: tool-capacity-collect
      name: '@opendb-dsh/tool-capacity-collect'
      config:
        # 2026-08-31 容量与增长报告：采样时序 opendb_capacity_samples + 整包存档 opendb_task_collects（首采从健康存档回填库大小）
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: tool-rules-catalog
      name: '@opendb-dsh/tool-rules-catalog'
    # threshold_list / threshold_set / threshold_reset（阈值配置的会话半边；set/reset 走 ask_user 确认流）
    - id: tool-thresholds
      name: '@opendb-dsh/tool-thresholds'
# ── P1 W4: task_report 工具 + 任务类型注册表（Runtime 侧，engine:false）──────
- insert:
    - id: opendb-tasks
      name: '@opendb-dsh/tasks'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        engine: false
# task-inspection / task-sql-audit 已下线（2026-08-21 user 拍板：被 task-health / task-sqlreview 取代）
- insert:
    - id: tool-task-report
      name: '@opendb-dsh/tool-task-report'
- insert:
    - id: tool-read-spill
      name: '@opendb-dsh/tool-read-spill'
# ── P1 W5: 记忆层（Runtime 侧：注入 + 读写工具）──────────────────────────────
- insert:
    - id: opendb-embeddings
      name: '@opendb-dsh/embeddings-openai-compat'
    - id: opendb-memory
      name: '@opendb-dsh/memory-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    # 平台阈值服务（user 2026-08-24：阈值可配置化）——Runtime 侧供采集工具 resolve 覆盖值、
    # threshold_* 工具读写；四个任务插件启动时向它注册规格（默认值 = 代码常量）
    - id: opendb-thresholds
      name: '@opendb-dsh/thresholds-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: memory-context
      name: '@opendb-dsh/memory-context'
    - id: tool-memory
      name: '@opendb-dsh/tool-memory'
# ── 交互纲领 §15：会话即任务管理 ─────────────────────────────────────────────
- insert:
    - id: tool-task-admin
      name: '@opendb-dsh/tool-task-admin'
# ── 默认模型（user 2026-08-22：v4-flash → v4-pro）───────────────────────────
- id: agent-default-model
  config:
    # 2026-08-29 user：DeepSeek 余额用完，换 Kimi K3 为默认（与 bundle-host 同形）
    provider: kimi
    model: k3
# ── 本机推理：mac 宿主 Ollama + Qwen3.8-27B（user 2026-08-24：仅作为可选模型）──
# Runtime 才是真正发起模型调用的一侧，路由必须在这里也声明一份（与 bundle-host 保持同形）。
- id: llm-pi-ai
  config:
    providers:
      # ── Kimi K3（Kimi Code API，OpenAI 兼容，实测支持 function calling，返回 reasoning_content；maxTokens 给足）──
      kimi:
        displayName: Kimi K3
        api: openai-completions
        baseURL: !!js process.env.OPENDB_KIMI_BASE_URL ?? 'https://api.kimi.com/coding/v1'
        apiKeyEnv: OPENDB_KIMI_API_KEY
        models:
          - id: k3
            name: Kimi K3
            contextWindow: 131072
            maxTokens: 32768
          - id: k3-256k
            name: Kimi K3 256K
            contextWindow: 262144
            maxTokens: 32768
      mac-ollama:
        displayName: 本机 M5 Max
        api: openai-completions
        baseURL: !!js process.env.OPENDB_MAC_LLM_URL ?? 'http://host.orb.internal:11434/v1'
        # 必填：省略则 pi-ai 走环境发现并整轮失败，见 bundle-host 同处注释。
        apiKeyEnv: OPENDB_MAC_LLM_API_KEY
        models:
          - id: !!js process.env.OPENDB_MAC_LLM_MODEL ?? 'qwen3.8:27b-mtp-q8_0'
            name: Qwen3.8 27B (本机)
            # 与 mac launchd plist 的 OLLAMA_CONTEXT_LENGTH 强耦合，改一处必须改另一处。
            contextWindow: 131072
            maxTokens: 32768
            # 档位实测依据见 bundle-host 同处注释。
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              xhigh: xhigh

# ── 任务重做 #1/#2：类型双侧注册（工具在独立包，见 tool-*-collect）────────────
- insert:
    - id: task-health
      name: '@opendb-dsh/task-health'
    - id: task-sqlreview
      name: '@opendb-dsh/task-sqlreview'
    - id: task-wdr
      name: '@opendb-dsh/task-wdr'
    - id: task-ddl
      name: '@opendb-dsh/task-ddl'
    - id: task-capacity
      name: '@opendb-dsh/task-capacity'
    - id: task-rules
      name: '@opendb-dsh/task-rules'
    # 阈值配置任务类型（双侧注册——W4 教训：Runtime 侧也必须加载类型包）
    - id: task-thresholds
      name: '@opendb-dsh/task-thresholds'
# ── P2 W1：incident 任务类型（双侧注册——W4 教训：Runtime 侧也必须加载类型包）──────
- insert:
    - id: task-incident
      name: '@opendb-dsh/task-incident'
# ── P2 W2：monitor-dashboard 类型双侧 + PG 运维技能包（skills 服务在 agent 树）──
- insert:
    - id: task-monitor-dashboard
      name: '@opendb-dsh/task-monitor-dashboard'
    - id: skill-pg
      name: '@opendb-dsh/skill-pg'
# ── P2 W3：知识库（Runtime 侧：服务+读写工具，会话灌入/检索主路径）────────────
- insert:
    - id: opendb-knowledge
      name: '@opendb-dsh/knowledge-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: tool-knowledge
      name: '@opendb-dsh/tool-knowledge'
# ── P3：记忆图谱（Host=实体抽取 leader；Runtime=memory_graph 工具）────────────
- insert:
    - id: memory-graph
      name: '@opendb-dsh/memory-graph'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── P3：NOTIFY 事件总线（唤醒链：thread 入队→worker 毫秒领取；task 入队→引擎即时 tick）──
- insert:
    - id: opendb-notify
      name: '@opendb-dsh/host-notify-bridge'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── P3：knowledge-vector（Qdrant 加速层——PG 真相，故障回退 pgvector）───────────
- insert:
    - id: opendb-vector-search
      name: '@opendb-dsh/knowledge-vector'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        qdrantUrl: !!js process.env.OPENDB_QDRANT_URL ?? ''
# ── P3：agent-presets-pg（预设落库：PG 真相物化到 .agent-presets，dsh 原生扫描）──
- insert:
    - id: agent-presets-pg
      name: '@opendb-dsh/agent-presets-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
