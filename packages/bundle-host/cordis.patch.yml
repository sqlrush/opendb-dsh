# opendb-dsh Host layer. Applied after dsh-base and dsh-web-app.
# Patch semantics (dsh): a row is addressed by id and its whole `config` is replaced;
# `name` is an assertion, not an override — so "replace a row" = disable it + insert ours.
- id: agent-loop
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: hmr
  disabled: true
- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js Number(process.env.OPENDB_HOST_PORT ?? 3080)
- insert:
    - id: session-persistence-pg
      name: '@opendb-dsh/session-persistence-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: agent-loop-dispatch
      name: '@opendb-dsh/agent-loop-dispatch'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        runtimeClass: !!js process.env.OPENDB_RUNTIME_CLASS ?? 'default'
        tailMs: 400
# Trust fence: keep dsh's derived LAN literals and add deployment authorities (NodePort / Ingress hosts)
# via OPENDB_TRUSTED_HOSTS="host:port,host:port". `inject: [webRuntime]` is inherited from the web-app row.
- id: connection
  config:
    trustedHosts: !!js "[...(process.env.OPENDB_TRUSTED_HOSTS ?? '').split(',').map(s => s.trim()).filter(Boolean), ...ctx.webRuntime.trustedHosts]"
# ── P1 W1 data plane: zero local persistent state ────────────────────────────
- id: storage-json
  disabled: true
- id: storage-domain
  config:
    backend: pg
    # P3 storage-redis：低敏可重建 domain 走 redis（投影缓存丢了自动重算、feedback 量为零）；
    # workspace（sessionIds 真相）绝不离开 pg——正确性金贵（2026-08-19 裁剪事故）
    routes:
      session_projcache: redis
      message_feedback: redis
- id: attachment-local
  disabled: true
- insert:
    - id: storage-pg
      name: '@opendb-dsh/storage-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: storage-redis
      name: '@opendb-dsh/storage-redis'
      config:
        url: !!js process.env.OPENDB_REDIS_URL ?? 'redis://localhost:6379/0'
    - id: attachment-s3
      name: '@opendb-dsh/attachment-s3'
    - id: tenant-context
      name: '@opendb-dsh/tenant-context'
# ── P1 W2: workspace == agent（零前端：官方 browse UI + 我们的 picker provider）──
- id: directory-picker
  disabled: true
- insert:
    - id: opendb-registry
      name: '@opendb-dsh/registry'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: directory-picker-agent
      name: '@opendb-dsh/directory-picker-agent'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
# ── P1 W2 批次2: OpenDB 管理页（/opendb RPC + settings.section）──
- insert:
    - id: ui-opendb
      name: '@opendb-dsh/ui-opendb'
# ── P1 W4: 任务插件契约（G1 冻结 §8.5）：引擎 + 审批（Host 侧）────────────────
- insert:
    - id: metrics-timescale
      name: '@opendb-dsh/metrics-timescale'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: dictionary-pg
      name: '@opendb-dsh/dictionary-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: opendb-approvals
      name: '@opendb-dsh/approvals'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: opendb-tasks
      name: '@opendb-dsh/tasks'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        engine: true
        tickMs: 30000
- insert:
    - id: task-inspection
      name: '@opendb-dsh/task-inspection'
    - id: task-sql-audit
      name: '@opendb-dsh/task-sql-audit'
# ── P1 W5: 记忆层（Host 侧：embeddings + memory + 报告入记忆）────────────────
- insert:
    - id: opendb-embeddings
      name: '@opendb-dsh/embeddings-openai-compat'
    - id: opendb-memory
      name: '@opendb-dsh/memory-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: memory-ingest
      name: '@opendb-dsh/memory-ingest'
# ── W5.5 批次1: opendb-harness 产品壳（自研侧栏替换官方工作区区块 + 主区页面）──
- id: ui-workspace
  disabled: true
- insert:
    - id: ui-harness
      name: '@opendb-dsh/ui-harness'
# ── 插件地图：platform-status（全局资源大盘，双半边）────────────────────────
- insert:
    - id: platform-status
      name: '@opendb-dsh/platform-status'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── 插件地图：onboarding（首次引导向导，client-only）───────────────────────
- insert:
    - id: onboarding
      name: '@opendb-dsh/onboarding'
# ── 插件地图：ui-node-monitor（节点监控面板，client-only，W6 拆包还债）─────────
- insert:
    - id: ui-node-monitor
      name: '@opendb-dsh/ui-node-monitor'
# ── 插件地图：P2 W1 事件驱动运维（task-incident 双半边 + alert-ddl 告警器）────────
- insert:
    - id: task-incident
      name: '@opendb-dsh/task-incident'
    - id: alert-ddl
      name: '@opendb-dsh/alert-ddl'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── 插件地图：P2 W2（常驻监控大盘 service 型双半边）────────────────────────────
- insert:
    - id: task-monitor-dashboard
      name: '@opendb-dsh/task-monitor-dashboard'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── 插件地图：P2 W3 知识与检索（Host 侧：知识服务+两个管理段+会话全文检索）──────
- insert:
    - id: opendb-knowledge
      name: '@opendb-dsh/knowledge-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: ui-knowledge
      name: '@opendb-dsh/ui-knowledge'
    - id: ui-memory
      name: '@opendb-dsh/ui-memory'
    - id: session-query-pg
      name: '@opendb-dsh/session-query-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── P3：记忆图谱（Host=实体抽取 leader；Runtime=memory_graph 工具）────────────
- insert:
    - id: memory-graph
      name: '@opendb-dsh/memory-graph'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── P3：NOTIFY 事件总线（唤醒链：thread 入队→worker 毫秒领取；task 入队→引擎即时 tick）──
- insert:
    - id: opendb-notify
      name: '@opendb-dsh/host-notify-bridge'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── P3：knowledge-vector（Qdrant 加速层——PG 真相，故障回退 pgvector）───────────
- insert:
    - id: opendb-vector-search
      name: '@opendb-dsh/knowledge-vector'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        qdrantUrl: !!js process.env.OPENDB_QDRANT_URL ?? ''
