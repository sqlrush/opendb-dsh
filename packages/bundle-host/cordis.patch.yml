# opendb-dsh Host layer. Applied after dsh-base and dsh-web-app.
# Patch semantics (dsh): a row is addressed by id and its whole `config` is replaced;
# `name` is an assertion, not an override — so "replace a row" = disable it + insert ours.
- id: agent-loop
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: hmr
  disabled: true
- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js Number(process.env.OPENDB_HOST_PORT ?? 3080)
- insert:
    - id: session-persistence-pg
      name: '@opendb-dsh/session-persistence-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        # Host 从不是运行中会话的写者：resume 时 dsh 补的 turn 闭合 / end-seed 若落库会顶掉 Runtime 同 seq 的事件（2026-08-25）
        guardRunningThreads: true
    - id: agent-loop-dispatch
      name: '@opendb-dsh/agent-loop-dispatch'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        runtimeClass: !!js process.env.OPENDB_RUNTIME_CLASS ?? 'default'
        tailMs: 400
# Trust fence: keep dsh's derived LAN literals and add deployment authorities (NodePort / Ingress hosts)
# via OPENDB_TRUSTED_HOSTS="host:port,host:port". `inject: [webRuntime]` is inherited from the web-app row.
- id: connection
  config:
    trustedHosts: !!js "[...(process.env.OPENDB_TRUSTED_HOSTS ?? '').split(',').map(s => s.trim()).filter(Boolean), ...ctx.webRuntime.trustedHosts]"
# ── P1 W1 data plane: zero local persistent state ────────────────────────────
- id: storage-json
  disabled: true
- id: storage-domain
  config:
    backend: pg
    # P3 storage-redis：低敏可重建 domain 走 redis（投影缓存丢了自动重算、feedback 量为零）；
    # workspace（sessionIds 真相）绝不离开 pg——正确性金贵（2026-08-19 裁剪事故）
    routes:
      session_projcache: redis
      message_feedback: redis
- id: attachment-local
  disabled: true
- insert:
    - id: storage-pg
      name: '@opendb-dsh/storage-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: storage-redis
      name: '@opendb-dsh/storage-redis'
      config:
        url: !!js process.env.OPENDB_REDIS_URL ?? 'redis://localhost:6379/0'
    - id: attachment-s3
      name: '@opendb-dsh/attachment-s3'
    - id: tenant-context
      name: '@opendb-dsh/tenant-context'
# ── P1 W2: workspace == agent（零前端：官方 browse UI + 我们的 picker provider）──
- id: directory-picker
  disabled: true
- insert:
    - id: opendb-registry
      name: '@opendb-dsh/registry'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: directory-picker-agent
      name: '@opendb-dsh/directory-picker-agent'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
# ── P1 W2 批次2: OpenDB 管理页（/opendb RPC + settings.section）──
- insert:
    - id: ui-opendb
      name: '@opendb-dsh/ui-opendb'
# ── P1 W4: 任务插件契约（G1 冻结 §8.5）：引擎 + 审批（Host 侧）────────────────
- insert:
    - id: metrics-timescale
      name: '@opendb-dsh/metrics-timescale'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: dictionary-pg
      name: '@opendb-dsh/dictionary-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: opendb-tasks
      name: '@opendb-dsh/tasks'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        engine: true
        tickMs: 30000
# task-inspection / task-sql-audit 已下线（2026-08-21 user 拍板：被 task-health / task-sqlreview 取代）
# ── P1 W5: 记忆层（Host 侧：embeddings + memory + 报告入记忆）────────────────
- insert:
    - id: opendb-embeddings
      name: '@opendb-dsh/embeddings-openai-compat'
    - id: opendb-memory
      name: '@opendb-dsh/memory-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    # 平台阈值服务（user 2026-08-24：阈值可配置化）——代码常量为默认、PG 存覆盖；
    # 四个任务插件启动时向它注册规格，Host 侧供大盘读取（thresholds/list、thresholds/history）
    - id: opendb-thresholds
      name: '@opendb-dsh/thresholds-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: memory-ingest
      name: '@opendb-dsh/memory-ingest'
# ── W5.5 批次1: opendb-harness 产品壳（自研侧栏替换官方工作区区块 + 主区页面）──
- id: ui-workspace
  disabled: true
- insert:
    - id: ui-harness
      name: '@opendb-dsh/ui-harness'
# ── 插件地图：platform-status（全局资源大盘，双半边）────────────────────────
- insert:
    - id: platform-status
      name: '@opendb-dsh/platform-status'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── 插件地图：onboarding（首次引导向导，client-only）───────────────────────
- insert:
    - id: onboarding
      name: '@opendb-dsh/onboarding'
# ── 会话内嵌卡（client-only）：为 opendb 采集工具接管 tool.call.toolview 渲染 ──
- insert:
    - id: ui-task-inline
      name: '@opendb-dsh/ui-task-inline'
    # 会话内图表卡：接管 metrics_chart / chart_render 的渲染（SVG 折线/面积/柱状 + hover + 阈值线）
    - id: ui-chart
      name: '@opendb-dsh/ui-chart'
# ── 插件地图：ui-node-monitor（节点监控面板，client-only，W6 拆包还债）─────────
- insert:
    - id: ui-node-monitor
      name: '@opendb-dsh/ui-node-monitor'
# ── 默认模型（user 2026-08-22：v4-flash → v4-pro）───────────────────────────
- id: agent-default-model
  config:
    # 2026-08-29 user：DeepSeek 余额用完，换 Kimi K3 为默认（deepseek-official 路由保留，选择器里仍可切回）
    provider: kimi
    model: k3
# ── 本机推理：mac 宿主 Ollama + Qwen3.8-27B（user 2026-08-24：仅作为可选模型）──
# dsh-base 已把 llm-pi-ai 以休眠姿态挂上（零路由）；这里手工声明一条路由把它唤醒。
- id: llm-pi-ai
  config:
    providers:
      # ── Kimi K3（月之暗面 Kimi Code API，OpenAI 兼容；2026-08-29 实测 /chat/completions + function calling 可用，
      #    返回 reasoning_content；max_tokens 给小会被思考吃光——同 Qwen 的教训，给足）──
      kimi:
        displayName: Kimi K3
        api: openai-completions
        baseURL: !!js process.env.OPENDB_KIMI_BASE_URL ?? 'https://api.kimi.com/coding/v1'
        apiKeyEnv: OPENDB_KIMI_API_KEY
        models:
          - id: k3
            name: Kimi K3
            contextWindow: 131072
            maxTokens: 32768
          - id: k3-256k
            name: Kimi K3 256K
            contextWindow: 262144
            maxTokens: 32768
      mac-ollama:
        displayName: 本机 M5 Max
        api: openai-completions
        baseURL: !!js process.env.OPENDB_MAC_LLM_URL ?? 'http://host.orb.internal:11434/v1'
        # Ollama 免鉴权，但 pi-ai 对手工声明的路由必须拿到凭据：省略此项会走
        # pi-ai 自身的环境发现，发现不到则整轮 PI_AI_ERROR「No API key」。
        apiKeyEnv: OPENDB_MAC_LLM_API_KEY
        models:
          - id: !!js process.env.OPENDB_MAC_LLM_MODEL ?? 'qwen3.8:27b-mtp-q8_0'
            name: Qwen3.8 27B (本机)
            # 必须与 mac 上 launchd plist 里的 OLLAMA_CONTEXT_LENGTH 一致，
            # 否则服务端静默截断 prompt。改一处必须改另一处。
            contextWindow: 131072
            # 实测：qwen3.8 思考默认开启，预算给小了会被思考吃光、正文返回空
            # （2026-08-24 实测 max_tokens=3000 时正文只剩 1 字节）。故给足。
            maxTokens: 32768
            # 2026-08-24 实测确认 reasoning_effort 被真正解析：
            #   伪造档位 → HTTP 400 并列出合法值；难题上思考量 low<medium<xhigh 单调递增
            #   （5829/6588 → 8221/9454 → 16819/24610 字节，两次采样一致）。
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              xhigh: xhigh

# ── 任务重做 #1/#2：健康检查 + SQL 审核优化（Host 侧=类型注册+引擎调度）────────
- insert:
    - id: task-health
      name: '@opendb-dsh/task-health'
    - id: task-sqlreview
      name: '@opendb-dsh/task-sqlreview'
    - id: task-wdr
      name: '@opendb-dsh/task-wdr'
    - id: task-ddl
      name: '@opendb-dsh/task-ddl'
    - id: task-capacity
      name: '@opendb-dsh/task-capacity'
    - id: task-rules
      name: '@opendb-dsh/task-rules'
    # 阈值配置任务类型（大盘半边；会话半边 threshold_* 工具在 Runtime）
    - id: task-thresholds
      name: '@opendb-dsh/task-thresholds'
# ── 插件地图：P2 W1 事件驱动运维（task-incident 双半边 + alert-ddl 告警器）────────
- insert:
    - id: task-incident
      name: '@opendb-dsh/task-incident'
    - id: alert-ddl
      name: '@opendb-dsh/alert-ddl'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── 插件地图：P2 W2（常驻监控大盘 service 型双半边）────────────────────────────
- insert:
    - id: task-monitor-dashboard
      name: '@opendb-dsh/task-monitor-dashboard'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── 插件地图：P2 W3 知识与检索（Host 侧：知识服务+两个管理段+会话全文检索）──────
- insert:
    - id: opendb-knowledge
      name: '@opendb-dsh/knowledge-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
    - id: ui-knowledge
      name: '@opendb-dsh/ui-knowledge'
    - id: ui-memory
      name: '@opendb-dsh/ui-memory'
    - id: session-query-pg
      name: '@opendb-dsh/session-query-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── P3：记忆图谱（Host=实体抽取 leader；Runtime=memory_graph 工具）────────────
- insert:
    - id: memory-graph
      name: '@opendb-dsh/memory-graph'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── P3：NOTIFY 事件总线（唤醒链：thread 入队→worker 毫秒领取；task 入队→引擎即时 tick）──
- insert:
    - id: opendb-notify
      name: '@opendb-dsh/host-notify-bridge'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
# ── 2026-08-25：Host 副本扇出——任一副本触碰的会话在所有副本上活起来，mux/host 推送流落在哪台都完整 ──
- insert:
    - id: host-fanout
      name: '@opendb-dsh/host-fanout'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        podName: !!js process.env.OPENDB_POD_NAME ?? process.env.HOSTNAME
# ── P3：knowledge-vector（Qdrant 加速层——PG 真相，故障回退 pgvector）───────────
- insert:
    - id: opendb-vector-search
      name: '@opendb-dsh/knowledge-vector'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
        qdrantUrl: !!js process.env.OPENDB_QDRANT_URL ?? ''
# ── P3：agent-presets-pg（预设落库：PG 真相物化到 .agent-presets，dsh 原生扫描）──
- insert:
    - id: agent-presets-pg
      name: '@opendb-dsh/agent-presets-pg'
      config:
        connectionString: !!js process.env.OPENDB_PG_URL
