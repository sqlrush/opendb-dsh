# P3 补齐：og 一主一备拓扑（P1 依赖表原文"含一主一备"——复制指标的真实数据源）。
# enmotech/opengauss:5.0.3 全量镜像原生主备：SERVER_MODE + REPL_CONN_INFO + OG_SUBNET。
# 互指用固定 ClusterIP（replconninfo 需确定地址）；自身地址启动时 hostname -i 探测注入。
apiVersion: v1
kind: Service
metadata: { name: og-ha-primary }
spec:
  clusterIP: 10.43.230.1
  selector: { app: og-ha, role: primary }
  ports:
    - { name: sql, port: 5432, targetPort: 5432 }
    - { name: repl, port: 5434, targetPort: 5434 }
---
apiVersion: v1
kind: Service
metadata: { name: og-ha-standby }
spec:
  clusterIP: 10.43.230.2
  selector: { app: og-ha, role: standby }
  ports:
    - { name: sql, port: 5432, targetPort: 5432 }
    - { name: repl, port: 5434, targetPort: 5434 }
---
apiVersion: v1
kind: Service
metadata: { name: og-ha-primary-np }
spec:
  type: NodePort
  selector: { app: og-ha, role: primary }
  ports: [{ port: 5432, targetPort: 5432, nodePort: 30021 }]
---
apiVersion: v1
kind: Service
metadata: { name: og-ha-standby-np }
spec:
  type: NodePort
  selector: { app: og-ha, role: standby }
  ports: [{ port: 5432, targetPort: 5432, nodePort: 30022 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: og-ha-primary }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: og-ha, role: primary } }
  template:
    metadata: { labels: { app: og-ha, role: primary } }
    spec:
      containers:
        - name: og
          image: docker.io/enmotech/opengauss-lite:5.0.3
          imagePullPolicy: Never
          command: ["bash", "-c", "export SELF_IP=$(hostname -I | cut -d' ' -f1); export REPL_CONN_INFO=\"replconninfo1 = 'localhost=$SELF_IP localport=5434 localservice=5432 remotehost=10.43.230.2 remoteport=5434 remoteservice=5432'\"; exec /entrypoint.sh gaussdb -M primary"]
          # og-lite 的备库 build 以 OS 用户 omm 连 replication，entrypoint 只给 repuser 放行——补 omm（幂等）
          lifecycle:
            postStart:
              exec:
                command: ["bash", "-c", "for i in $(seq 1 90); do H=/var/lib/opengauss/data/pg_hba.conf; if [ -f $H ]; then grep -q 'replication omm' $H || { echo 'host replication omm 10.42.0.0/16 trust' >> $H; su - omm -c 'LD_LIBRARY_PATH=/usr/local/opengauss/lib /usr/local/opengauss/bin/gs_ctl reload -D /var/lib/opengauss/data' || true; }; exit 0; fi; sleep 2; done"]
          env:
            - { name: GS_PASSWORD, value: "Root@1234" }
            - { name: SERVER_MODE, value: primary }
            - { name: OG_SUBNET, value: "10.42.0.0/16" }
            - { name: GS_NODENAME, value: ogprimary }
            - { name: TZ, value: Asia/Shanghai }
          ports: [{ containerPort: 5432 }, { containerPort: 5434 }]
          readinessProbe: { tcpSocket: { port: 5432 }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources: { requests: { cpu: 200m, memory: 1Gi }, limits: { memory: 4Gi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/opengauss }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: og-ha-primary-data }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 4Gi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: og-ha-primary-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 4Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: og-ha-standby }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: og-ha, role: standby } }
  template:
    metadata: { labels: { app: og-ha, role: standby } }
    spec:
      containers:
        - name: og
          image: docker.io/enmotech/opengauss-lite:5.0.3
          imagePullPolicy: Never
          command: ["bash", "-c", "export SELF_IP=$(hostname -I | cut -d' ' -f1); export REPL_CONN_INFO=\"replconninfo1 = 'localhost=$SELF_IP localport=5434 localservice=5432 remotehost=10.43.230.1 remoteport=5434 remoteservice=5432'\"; exec /entrypoint.sh gaussdb -M standby"]
          env:
            - { name: GS_PASSWORD, value: "Root@1234" }
            - { name: SERVER_MODE, value: standby }
            - { name: OG_SUBNET, value: "10.42.0.0/16" }
            - { name: GS_NODENAME, value: ogstandby }
            - { name: TZ, value: Asia/Shanghai }
          ports: [{ containerPort: 5432 }, { containerPort: 5434 }]
          readinessProbe: { tcpSocket: { port: 5432 }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources: { requests: { cpu: 200m, memory: 1Gi }, limits: { memory: 4Gi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/opengauss }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: og-ha-standby-data }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 4Gi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: og-ha-standby-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 4Gi } } }
