# W6 规模验收：og 舰队（独立 og-k8s 集群，user 定案与平台集群分离）
# 20 个真实 openGauss-lite 单机 pod；NodePort 30001-30020 暴露给平台集群。
# 别名节点（og-sim-*）在平台注册表轮流指向这 20 个端口，凑 950 节点。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: og-node
spec:
  serviceName: og-node
  replicas: 20
  podManagementPolicy: Parallel
  selector: { matchLabels: { app: og-node } }
  template:
    metadata: { labels: { app: og-node } }
    spec:
      containers:
        - name: og
          image: docker.io/enmotech/opengauss-lite:5.0.3
          imagePullPolicy: Never
          env:
            - { name: GS_PASSWORD, value: "Root@1234" }
            - { name: TZ, value: Asia/Shanghai }
            # og 节点名禁止连字符（gs_initdb 校验），且我们按 host:port 寻址不依赖它 → 固定值
            - { name: GS_NODENAME, value: ognode }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { tcpSocket: { port: 5432 }, initialDelaySeconds: 20, periodSeconds: 10 }
          # 2Gi：1Gi 在 ~47 路采集连接/实例下 OOMKilled（2026-08-19 实测，且无卷时重启即 initdb 抹掉账号）
          resources: { requests: { cpu: 100m, memory: 500Mi }, limits: { memory: 2Gi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/opengauss }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
