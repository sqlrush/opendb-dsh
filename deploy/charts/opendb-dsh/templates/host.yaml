apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-host
  labels: {{- include "opendb.labels" . | nindent 4 }}
spec:
  {{- if not (and .Values.keda.enabled .Values.host.autoscale) }}
  replicas: {{ .Values.host.replicas }}
  {{- end }}{{/* autoscale 时副本数交给 KEDA/HPA，helm 不回写 */}}
  # P3 多副本：agents-dir 改 emptyDir+initContainer 重建（RWO PVC 与多副本不兼容），恢复滚动更新
  # 新 pod 就绪（插件包可服务）之前旧 pod 不下线：单副本也零窗口
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: {{ .Release.Name }}-host } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-host } }
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        {{- if .Values.postgres.builtin }}
        {{- include "opendb.waitForPg" . | nindent 8 }}
        {{- end }}
        # P3：每副本启动时从注册表重建全部 agent 工作区目录（emptyDir 随 pod 生灭——
        # 目录缺失会让 dsh workspace 把 sessionIds 裁光，见 CLUSTER.md 2026-08-19 复盘）。
        # 运行期新建 agent 的目录由 ui-opendb 周期 reconcile 补齐到每个副本。
        - name: agents-dir-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app/packages/db
          command: ["node", "-e", "const pg=require('pg');const fs=require('fs');(async()=>{const p=new pg.Pool({connectionString:process.env.OPENDB_PG_URL});try{const r=await p.query('SELECT name FROM dsh_agents');for(const a of r.rows){fs.mkdirSync('/var/lib/dsh/agents/'+a.name,{recursive:true,mode:0o700});}console.log('agent dirs:',r.rowCount);}catch(e){console.log('skip (fresh install?):',String(e.message));}await p.end();})()"]
          env:
            {{- include "opendb.commonEnv" . | nindent 12 }}
          volumeMounts:
            - { name: agents-dir, mountPath: /var/lib/dsh/agents }
      serviceAccountName: {{ .Release.Name }}-host
      containers:
        - name: host
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--profile", "host"]
          env:
            {{- include "opendb.commonEnv" . | nindent 12 }}
            - { name: OPENDB_HOST_PORT, value: {{ .Values.host.port | quote }} }
            - { name: OPENDB_TRUSTED_HOSTS, value: {{ include "opendb.trustedHosts" . | quote }} }
            {{- if .Values.debug.dispatchTraceLog }}
            - { name: OPENDB_DEBUG_LOG, value: {{ .Values.debug.dispatchTraceLog | quote }} }
            {{- end }}
          ports: [{ containerPort: {{ .Values.host.port }} }]
          # 2026-08-26 事故：只探 TCP 端口 → 端口一开流量就切过去，插件包还没就绪 → 那一窗口里加载的页面拿不到任务面板插件，
          # 任务页退化成默认历史列表。改为探一个插件包 URL：只有 dsh 插件系统真正起来了才 200。Host 头用受信任主机名过 fence。
          # 旧 pod 收到终止信号后先停 8 秒再退出：kubelet 摘 endpoint 与 traefik 更新路由有 ~1s 错位，
          # 立刻退出会让切换瞬间的请求打到已死的进程（2026-08-26 rollout.sh 实测 240 次探测里 1 次非 200）
          lifecycle: { preStop: { exec: { command: ["sh", "-c", "sleep 8"] } } }
          readinessProbe:
            httpGet:
              path: /plugins/@opendb-dsh/ui-harness/client.js
              port: {{ .Values.host.port }}
              httpHeaders: [{ name: Host, value: "localhost:{{ .Values.host.port }}" }]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources: {{- toYaml .Values.host.resources | nindent 12 }}
          volumeMounts:
            # agents 工作区目录必须跨重启存活：dsh workspace 启动校验 header.cwd 目录，
            # 目录丢失 → 全部会话标 invalid → 首次 mutate 持久化裁光 sessionIds（2026-08-19 事故）
            - { name: agents-dir, mountPath: /var/lib/dsh/agents }
      volumes:
        - name: agents-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-host
  labels: {{- include "opendb.labels" . | nindent 4 }}
  {{- if gt (int .Values.host.replicas) 1 }}
  annotations:
    # P3 多副本：cookie 粘性——同一浏览器固定到同一 Host（WS 会话亲和；副本挂掉 traefik 自动改派）
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: opendb-host
  {{- end }}
spec:
  selector: { app: {{ .Release.Name }}-host }
  ports: [{ port: {{ .Values.host.port }}, targetPort: {{ .Values.host.port }} }]
