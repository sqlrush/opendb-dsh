# platform-status 插件的 k8s 只读权限（仅本 namespace pods get/list）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-host
  labels: {{- include "opendb.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-host-readonly
  labels: {{- include "opendb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-host-readonly
  labels: {{- include "opendb.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-host
roleRef:
  kind: Role
  name: {{ .Release.Name }}-host-readonly
  apiGroup: rbac.authorization.k8s.io
