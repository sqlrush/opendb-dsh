{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
  labels: {{- include "opendb.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: {{ .Values.minio.consolePort }}, targetPort: 9001 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-minio-data
  labels: {{- include "opendb.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.minio.storageClassName }}
  storageClassName: {{ .Values.minio.storageClassName }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.minio.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-minio
  labels: {{- include "opendb.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: {{ .Release.Name }}-minio } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-minio } }
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: {{ .Values.minio.rootUser | quote }} }
            - { name: MINIO_ROOT_PASSWORD, value: {{ .Values.minio.rootPassword | quote }} }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: 9000 }, initialDelaySeconds: 5, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-minio-data }
---
# one-shot bucket creation (idempotent)
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-minio-init
  labels: {{- include "opendb.labels" . | nindent 4 }}
  annotations: { "helm.sh/hook": post-install,post-upgrade, "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded }
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set m http://{{ .Release.Name }}-minio:9000 {{ .Values.minio.rootUser }} {{ .Values.minio.rootPassword }}; do sleep 2; done
              mc mb --ignore-existing m/{{ .Values.minio.bucket }}
{{- end }}
