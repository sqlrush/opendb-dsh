{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
  labels: {{- include "opendb.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-ollama }
  ports: [{ port: 11434, targetPort: 11434 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ollama-models
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.ollama.storageClassName }}
  storageClassName: {{ .Values.ollama.storageClassName }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.ollama.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ollama
  labels: {{- include "opendb.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }   # PVC RWO
  selector: { matchLabels: { app: {{ .Release.Name }}-ollama } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-ollama } }
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports: [{ containerPort: 11434 }]
          env:
            - { name: OLLAMA_KEEP_ALIVE, value: "24h" }   # bge-m3 常驻内存，避免每次请求重载
          volumeMounts: [{ name: models, mountPath: /root/.ollama }]
          readinessProbe: { httpGet: { path: /api/tags, port: 11434 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: {{- toYaml .Values.ollama.resources | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-ollama-models }
---
# 首次拉取 embedding 模型（幂等：已存在则秒完成）。minio-init 同款模式。
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ollama-pull-{{ .Release.Revision }}
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -e
              until curl -sf http://{{ .Release.Name }}-ollama:11434/api/tags > /dev/null; do echo waiting ollama; sleep 5; done
              curl -sf -X POST http://{{ .Release.Name }}-ollama:11434/api/pull -d '{"model":{{ .Values.ollama.embeddingModel | quote }}}' | tail -c 200
              echo; echo pull done
{{- end }}
