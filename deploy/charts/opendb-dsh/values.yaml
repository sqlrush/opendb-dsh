# opendb-dsh Helm values (defaults target the mac/OrbStack k3s test cluster; override for other environments)
image:
  repository: host.orb.internal:5050/opendb-dsh
  tag: dev
  pullPolicy: Always            # dev iteration re-pushes the same tag; pin by git sha in real environments

llm:
  existingSecret: opendb-dsh-llm  # must contain DEEPSEEK_API_KEY (create with deploy/k8s/p0/secret.example.yaml)
  deepseekBaseUrl: ""             # optional DEEPSEEK_BASE_URL

postgres:
  builtin: true
  # W3: timescaledb-ha = debian/glibc + timescaledb + pgvector（W5 记忆层直接用）。
  # 换镜像 = 换数据目录布局：dump → 删 PVC → 新镜像 initdb → restore（见 CLUSTER.md W3 批次2）。
  image: timescale/timescaledb-ha:pg16
  mountPath: /home/postgres/pgdata          # timescaledb-ha 约定挂载点；postgres:16 用 /var/lib/postgresql/data
  pgdata: /home/postgres/pgdata/data
  user: dsh
  password: dsh                   # dev only; use existingSecret in real environments
  database: dsh
  storage: 10Gi
  storageClassName: ""            # "" = cluster default (k3s local-path)
  # external: set builtin=false and give a full URL
  externalUrl: ""

minio:
  enabled: true
  image: quay.io/minio/minio:latest   # pin after first pull (record digest in CLUSTER.md)
  rootUser: opendb
  rootPassword: opendb-minio-dev      # dev only
  bucket: opendb-dsh
  storage: 20Gi
  storageClassName: ""
  consolePort: 9001

host:
  replicas: 3               # P3: 多副本 + sticky cookie + 引擎 leader 竞选（autoscale 启用时 KEDA 接管副本数）
  autoscale: { min: 3, max: 6, targetConnections: 50 }   # P3 HPA-by-WS（KEDA metrics-api）
  port: 3080
  # k8s-cp.orb.local = OrbStack 注册的系统 resolver 域名，对 mac 睡眠/换网免疫（IP 直连路由会被热点切换挤掉）
  extraTrustedHosts: ["192.168.139.164", "192.168.139.164:30080", "k8s-cp.orb.local", "localhost:18080", "127.0.0.1:18080"]
  hostPathPort: 3080
  resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 2Gi } }

runtime:
  classes:
    - name: default               # runtime class (== OPENDB_RUNTIME_CLASS); pool = one Deployment per class
      profile: runtime            # dsh profile dir under /app/profiles
      replicas: 2
      autoscale: { min: 2, max: 8, targetPending: 2 }   # W6: KEDA 按待认领队列深度扩缩
      resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 2Gi } }
    - name: collector             # W3: 采集池（无 agent loop；指标每分钟、字典每 10 分钟）
      profile: collector
      replicas: 1
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
  healthPort: 9090
  # 节点凭据 Secret（W3）：kubectl -n <ns> create secret generic opendb-db-credentials \
  #   --from-literal=credentials.json='{"og5":{"username":"opendb_ro","password":"<pw>"}}'
  dbCredentialsSecret: opendb-db-credentials
  terminationGracePeriodSeconds: 330
  pollMs: 2000
  heartbeatMs: 5000
  staleMs: 30000

ingress:
  enabled: true
  className: traefik
  host: opendb.local
  extraHosts: [opendb.lab]      # .local 是 macOS mDNS 特殊域，部分浏览器/代理绕过 hosts——备用域名
  tls: false

debug:
  dispatchTraceLog: ""            # set to a file path to enable agent-loop-dispatch traces

# ── W5: 集群内 embedding 服务（Ollama + bge-m3，1024 维；user 已拍板）─────────
ollama:
  enabled: true
  image: ollama/ollama:0.6.8          # 钉版；arm64 ✓
  embeddingModel: bge-m3
  storage: 8Gi
  storageClassName: ""
  resources: { requests: { cpu: 500m, memory: 2Gi }, limits: { memory: 6Gi } }

# ── W6: KEDA 扩缩（需先在集群装 keda operator：helm install keda kedacore/keda -n keda）──
keda:
  enabled: true
  pollingInterval: 10       # 秒，队列深度查询频率
  cooldownPeriod: 120       # 秒，缩容冷却

# ── P2 W4: 控制台登录（connection-auth 简版=traefik basicAuth；token/IdP 版在暂缓池）──
auth:
  enabled: true
  # htpasswd 行（apr1/bcrypt）；lab 实际值经 --set-string 注入（mac ~/opendb-k8s/console-htpasswd.txt），
  # 明文密码在 mac ~/opendb-k8s/console-password.txt——都不进 git
  htpasswd: ""

# ── P3: storage-redis（kv 低敏 domain 后端；workspace 留 pg）─────────────────
redis:
  enabled: true
  image: redis:7-alpine

# ── P3: knowledge-vector（Qdrant 检索加速层；PG 真相不动，故障回退 pgvector）──
qdrant:
  enabled: true
  image: qdrant/qdrant:v1.12.4
